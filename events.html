<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Events | EventHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-ticket-alt"></i> EventHub
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html" class="active">Events</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <button class="dark-mode-toggle" id="darkModeToggle">
            <i class="fas fa-moon"></i>
        </button>
        <div class="mobile-menu">
            <i class="fas fa-bars"></i>
        </div>
    </nav>

    <section class="page-header">
        <h1>All <span class="gradient-text">Events</span></h1>
        <p>Discover and book the best events happening near you</p>
    </section>

    <section class="filter-section">
        <div class="filter-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search events...">
            </div>
            <select id="categoryFilter" class="filter-select">
                <option value="all">All Categories</option>
                <option value="Tech">Technology</option>
                <option value="Business">Business</option>
                <option value="Music">Music</option>
                <option value="Sports">Sports</option>
                <option value="Festival">Festival</option>
            </select>
            <select id="sortFilter" class="filter-select">
                <option value="default">Sort by: Default</option>
                <option value="priceLow">Price: Low to High</option>
                <option value="priceHigh">Price: High to Low</option>
                <option value="date">Date: Earliest First</option>
            </select>
        </div>
    </section>

    <section class="events">
        <div id="eventContainer" class="event-container">
            <!-- Events loaded dynamically -->
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3><i class="fas fa-ticket-alt"></i> EventHub</h3>
                <p>Your premier platform for discovering and booking amazing events.</p>
            </div>
            <div class="footer-section">
                <h4>Quick Links</h4>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 EventHub. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/toast.js"></script>
    <script src="js/script.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
