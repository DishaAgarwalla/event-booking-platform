<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Event | EventHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-ticket-alt"></i> EventHub
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html">Events</a></li>
        </ul>
        <button class="dark-mode-toggle" id="darkModeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </nav>

    <section class="booking">
        <div class="booking-header">
            <i class="fas fa-ticket-alt"></i>
            <h1>Book Your Ticket</h1>
            <p>Fill in the details to complete your booking</p>
        </div>

        <div id="eventSummary" class="event-summary"></div>

        <form id="bookingForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone Number</label>
                <input type="tel" id="phone" placeholder="+91 XXXXX XXXXX" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-ticket"></i> Ticket Type</label>
                    <select id="ticketType">
                        <option value="499">Regular Ticket - ₹499</option>
                        <option value="999">VIP Ticket - ₹999 (Includes Premium Seating + Goodies)</option>
                        <option value="1499">VVIP Ticket - ₹1499 (Backstage Access + Meet & Greet)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-sort-amount-up"></i> Quantity</label>
                    <input type="number" id="quantity" value="1" min="1" max="10">
                </div>
            </div>

            <div class="price-breakdown">
                <h3>Price Details</h3>
                <div class="price-row">
                    <span>Ticket Price:</span>
                    <span id="ticketPriceDisplay">₹499</span>
                </div>
                <div class="price-row">
                    <span>Quantity:</span>
                    <span id="quantityDisplay">1</span>
                </div>
                <div class="price-row total">
                    <span>Total Amount:</span>
                    <span id="totalPrice">₹499</span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-lock"></i> Proceed to Secure Checkout
            </button>
        </form>
    </section>

    <script src="js/toast.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
