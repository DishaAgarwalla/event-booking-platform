<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | EventHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <section class="confirmation-container">
        <div class="confirmation-card">
            <div class="success-animation">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1>Booking Confirmed! 🎉</h1>
            <p>Your tickets have been successfully booked</p>

            <div id="confirmationDetails" class="booking-summary"></div>

            <div class="confirmation-actions">
                <button id="downloadTicket" class="btn btn-primary">
                    <i class="fas fa-download"></i> Download Ticket
                </button>
                <button id="addToCalendarBtn" class="btn btn-outline">
                    <i class="fas fa-calendar-plus"></i> Add to Calendar
                </button>
                <button id="shareWhatsAppBtn" class="btn btn-outline">
                    <i class="fab fa-whatsapp"></i> Share on WhatsApp
                </button>
                <a href="events.html" class="btn btn-outline">
                    <i class="fas fa-calendar"></i> Browse More Events
                </a>
                <a href="index.html" class="btn btn-outline">
                    <i class="fas fa-home"></i> Return Home
                </a>
            </div>
        </div>
    </section>

    <script src="js/toast.js"></script>
    <script src="js/confetti.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
